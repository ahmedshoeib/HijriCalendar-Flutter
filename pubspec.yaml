name: hijri_calendar_flutter
description: A customizable Hijri calendar for Flutter with four calculation systems, Arabic/RTL, date selection, and official month-start corrections.
version: 1.0.1
repository: https://github.com/ahmedshoeib/HijriCalendar-Flutter
screenshots:
  - description: English Hijri calendar with configurable calculation and selection.
    path: documentation/images/calendar-english.png
  - description: Arabic calendar with right-to-left layout and range selection.
    path: documentation/images/calendar-arabic.png
topics:
  - calendar
  - hijri
  - islamic
  - date-picker
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'
dependencies:
  flutter:
    sdk: flutter
  intl: '>=0.20.2 <0.21.0'
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:
